<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      /* The window is transparent until the bundle runs: this paints the icon from the first frame. */
      #boot { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; background: #191919; transition: opacity 0.5s ease; }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot img { width: 128px; height: 128px; user-select: none; animation: boot-in 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      #boot.still img { animation: none; }
      @keyframes boot-in { from { opacity: 0; transform: scale(0.85); } }
      html[data-animations="off"] #boot, html[data-animations="off"] #boot img { animation: none; transition: none; }
    </style>
  </head>

  <body>
    <div id="boot" data-tauri-drag-region><img src="/splash-icon.png" alt="" draggable="false" /></div>
    <div id="app"></div>
    <script>
      // The start page reloads into /init: the icon fades in once, not twice.
      try {
        if (sessionStorage.getItem("nh-boot")) document.getElementById("boot").className = "still";
        sessionStorage.setItem("nh-boot", "1");
      } catch (e) {}
      // Whatever goes wrong, the icon never stays on top of the app.
      setTimeout(function () { var b = document.getElementById("boot"); if (b) b.remove(); }, 15000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
