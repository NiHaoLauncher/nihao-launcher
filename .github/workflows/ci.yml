# Builds and tests everything on every push and pull request. Windows, because that is the platform
# the launcher is tested on. A release is still built and published by hand (see
# DOCUMENTATION/general/build-and-run.md and signing.md).
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # runs the TypeScript tests without a flag

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            Installer

      - name: The version is the same in all three files
        run: node srcipts/check-version.mjs

      - name: Install
        run: |
          npm ci
          npm ci --prefix plugin-sources/games/minecraft/ui

      # tauri::generate_context! reads the built launcher UI (dist/) and the Minecraft module embeds its
      # built UI (dist_ui/): both have to exist before cargo compiles.
      - name: Build the UIs
        run: |
          npm run build
          npm run build --prefix plugin-sources/games/minecraft/ui

      - name: Type-check the Minecraft UI
        run: npx tsc --noEmit -p plugin-sources/games/minecraft/ui

      - name: TypeScript tests
        run: node --test src/duplicates.test.ts
        working-directory: plugin-sources/games/minecraft/ui

      - name: Rust tests (launcher, launcher-common, Minecraft module)
        run: cargo test --workspace

      - name: Rust tests (installer, its own workspace)
        run: cargo test --manifest-path Installer/Cargo.toml
