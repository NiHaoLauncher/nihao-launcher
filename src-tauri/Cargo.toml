[package]
name = "nihao-client"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
launcher-common = { path = "../plugin-sources/common" }
tauri = { version = "1", features = [ "dialog-save", "window-unmaximize", "window-minimize", "window-maximize", "window-unminimize", "window-hide", "window-start-dragging", "window-set-title", "window-show", "window-close", "app-all", "dialog-open", "shell-open", "process-relaunch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
once_cell = "1.19.0"
base64 = "0.22.1"
sysinfo = "0.36.0"

lazy_static = "1.5.0"
chrono = "0.4"
reqwest = { version = "0.11", features = ["blocking", "json", "stream"] }
futures-util = "0.3.31"
dirs = "5.0.1"
dotenvy = "0.15"
mime_guess = "2.0.5"
url = "2.5.8"
notify-debouncer-mini = "0.7.0"
zip = "2"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
