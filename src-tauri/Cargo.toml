[package]
name = "nihao-client"
version = "0.0.93"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1", features = [] }
dotenvy = "0.15"

[dependencies]
launcher-common = { path = "../plugin-sources/common" }
tauri = { version = "1", features = [ "dialog-save", "window-unmaximize", "window-minimize", "window-maximize", "window-unminimize", "window-hide", "window-start-dragging", "window-set-title", "window-show", "window-close", "app-all", "dialog-open", "shell-open", "process-relaunch"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"

tokio = { version = "1", features = ["full"] }
base64 = "0.22.1"

lazy_static = "1.5.0"
reqwest = { version = "0.11", features = ["json", "stream", "multipart"] }
futures-util = "0.3.31"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
dotenvy = "0.15"
mime_guess = "2.0.5"
url = "2.5.8"
sha2 = "0.10"
ed25519-compact = { version = "2", default-features = false }
hex = "0.4"
notify-debouncer-mini = "0.7.0"
zip = "2"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
discord-rich-presence = "1.1.0"
# No crates.io release targets Tauri v1 (only v2) — the v1-compatible version only ever
# existed on this branch of the official plugins monorepo. See discord_presence.rs's "Play
# Together" button / deeplink.rs for what this is for.
tauri-plugin-single-instance = { git = "https://github.com/tauri-apps/plugins-workspace", branch = "v1" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
