[package]
name = "minecraft"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
launcher-common = { path = "../../common" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
async-trait = "0.1"
serde_json = "1"
dirs = "5.0.1"
reqwest = { version = "0.11", features = ["blocking", "json", "stream", "multipart"] }
futures-util = "0.3.31"
serde = { version = "1", features = ["derive"] }
zip-extract = "0.2.1"
rust-embed = "8.11.0"
base64 = "0.22.1"
sysinfo = "0.36.0"
sha2 = "0.10"
sha1 = "0.10"
md5 = "0.7"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

