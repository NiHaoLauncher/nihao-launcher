[package]
name = "nihao-installer"
version = "0.1.0"
edition = "2021"
description = "Tiny installer: installs the NiHao Launcher from a zip next to it, else the latest release from GitHub or GitLab"

# Standalone on purpose: the root workspace would ignore this crate's size-oriented [profile.release].
[workspace]

[dependencies]
# glow = OpenGL renderer (no wgpu: ~5 MB lighter); default_fonts has Cyrillic.
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# ureq 2: `timeout_read` is a per-read timeout, i.e. exactly the launcher's "no progress for 20 s" rule.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
serde_json = "1"
# Release signatures (shared/release_sig.rs): the key is in keys/update.pub.
ed25519-compact = { version = "2", default-features = false }
sha2 = "0.10"
dirs = "5"
rfd = "0.17"
# Images in release notes: png (already in eframe), plus jpeg, and animated gif through egui_extras.
egui_extras = { version = "0.35", default-features = false, features = ["image", "gif"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
